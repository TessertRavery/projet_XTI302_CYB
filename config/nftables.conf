#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Autoriser le trafic local (loopback)
        iif "lo" accept

        # Autoriser le trafic des connexions deja etablies ou liees
        ct state established,related accept

        # Rejeter les paquets invalides
        ct state invalid drop

        # Autoriser uniquement SSH (port 22/TCP)
        tcp dport 22 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
